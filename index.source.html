<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WizMedik | Doktori i online zakazivanje u Bosni i Hercegovini</title>
    <meta
      name="description"
      content="Pronađite doktore, klinike, laboratorije, banje i domove za njegu starijih i bolesnih u Bosni i Hercegovini. Zakažite termin online brzo i jednostavno."
    />
    <meta name="author" content="WizMedik" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Default canonical (route-specific canonical set via react-helmet) -->
    <link rel="canonical" href="https://wizmedik.com/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.wizmedik.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      />
    </noscript>

    <!-- Geo -->
    <meta name="geo.region" content="BA" />
    <meta name="geo.placename" content="Bosna i Hercegovina" />

    <!-- Open Graph -->
    <meta property="og:title" content="WizMedik | Doktori i online zakazivanje u BiH" />
    <meta
      property="og:description"
      content="Pronađite doktore, klinike, laboratorije, banje i domove za njegu starijih i bolesnih u Bosni i Hercegovini. Zakažite termin online."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wizmedik.com/" />
    <meta property="og:image" content="https://wizmedik.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="bs_BA" />
    <meta property="og:site_name" content="WizMedik" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WizMedik | Doktori i online zakazivanje u BiH" />
    <meta
      name="twitter:description"
      content="Pronađite i uporedite zdravstvene usluge u Bosni i Hercegovini te zakažite termin online."
    />
    <meta name="twitter:image" content="https://wizmedik.com/og-image.jpg" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.png?v=5" type="image/png" />
    <link rel="icon" href="/favicon.ico?v=5" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png?v=5" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WizMedik" />

    <!-- Theme -->
    <meta name="theme-color" content="#0891b2" />
    <meta name="msapplication-TileColor" content="#0891b2" />
    <meta name="msapplication-navbutton-color" content="#0891b2" />

    <!-- Schema: Organization + WebSite. WizMedik is a discovery platform, not a care provider. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://wizmedik.com/#organization",
            "name": "WizMedik",
            "url": "https://wizmedik.com/",
            "logo": "https://wizmedik.com/wizmedik-logo.png",
            "description": "Digitalna platforma za pronalazak doktora, ustanova i online zakazivanje termina u Bosni i Hercegovini. WizMedik ne pruža medicinske usluge.",
            "areaServed": {
              "@type": "Country",
              "name": "Bosna i Hercegovina"
            },
            "sameAs": [
              "https://www.facebook.com/wizmedik",
              "https://www.instagram.com/wizmedik.ba"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://wizmedik.com/#website",
            "name": "WizMedik",
            "url": "https://wizmedik.com/",
            "inLanguage": "bs",
            "publisher": {
              "@id": "https://wizmedik.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://wizmedik.com/doktori?pretraga={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Google Consent Mode v2 (default denied) + GA4 tag bootstrap -->
    <script src="/google-consent-bootstrap.js"></script>
    <script>
      (function () {
        var gaId = '%VITE_GA_MEASUREMENT_ID%';
        if (!gaId || gaId.indexOf('VITE_') !== -1 || gaId.indexOf('G-') !== 0) {
          return;
        }

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
        document.head.appendChild(script);

        window.gtag('js', new Date());
        window.gtag('config', gaId, {
          send_page_view: false,
          anonymize_ip: true,
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
